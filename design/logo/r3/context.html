<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:24px;background:#e9edf1;font:13px system-ui;width:1344px;box-sizing:border-box}
.k{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px}
.nav{display:flex;align-items:center;gap:22px;background:#08192A;color:#F3F6F9;padding:14px 20px;border-radius:8px}
.nav img{height:44px}.nav .s{margin-left:auto;opacity:.75}.cta{background:#FF6A2B;color:#1A0A02;padding:9px 14px;font-weight:700}
.row{display:flex;gap:18px;align-items:center;margin-top:12px}
.tab{display:flex;gap:8px;align-items:center;background:#dde3e9;border-radius:8px 8px 0 0;padding:8px 12px;width:230px}
.tab img{width:16px;height:16px;border-radius:3px}
.app{width:96px;height:96px;border-radius:22px;overflow:hidden}.app img{width:100%;height:100%}
.sz img{display:block}.sz{display:flex;gap:12px;align-items:end}
</style>
<script>
const C=[["A · Odbicie","a2"],["B · Refrakcja","b"],["C · Boja","c"]];
document.write(C.map(([t,k])=>`<div class="k"><h2>${t}</h2>
<div class="nav"><img src="${k}-lockup-dark.svg"><span class="s">Realizacje · Cennik · Proces · Kontakt</span><span class="cta">Sprawdź koszt →</span></div>
<div class="row"><div class="tab"><img src="${k}-symbol-color.svg"><span>Blueport Studio — Strony…</span></div>
<div class="app"><img src="${k}-symbol-color.svg"></div>
<img src="${k}-lockup-light.svg" style="height:40px">
<div class="sz">${[48,32,24,16].map(s=>`<img src="${k}-symbol.svg" width="${s}" height="${s}">`).join("")}</div></div></div>`).join(""));
</script>
