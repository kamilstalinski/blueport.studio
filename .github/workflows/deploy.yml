name: Test & Deploy

on:
  push:
    branches: [main, prod]

jobs:
  test:
    name: Testy i type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalacja zaleznosci
        run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build testowy
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
  deploy:
    name: Deploy na Hetzner
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Deploy przez SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: NEXT_PUBLIC_SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,RESEND_API_KEY,RESEND_FROM,NOTIFICATION_EMAIL
          script: |
            cd ~/blueport.studio
            git checkout next-env.d.ts || true
            git pull origin prod
            npm ci
            npm run build
            pm2 restart blueport
