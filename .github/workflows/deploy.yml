name: Test & Deploy

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Testy i type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalacja zaleznosci
        run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testy jednostkowe
        run: npm test
      - name: Build testowy
        run: npm run build
        env:
          RESEND_API_KEY: re_ci_dummy
          RESEND_FROM: Blueport <ci@example.com>
          NOTIFICATION_EMAIL: ci@example.com

  e2e:
    name: Testy e2e i wizualne
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep the tag equal to the pinned @playwright/test version: baselines are rendered in this image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "true"
      PW_SERVER: prod
      PW_PORT: "3100"
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM: Blueport <ci@example.com>
      NOTIFICATION_EMAIL: ci@example.com
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Instalacja zaleznosci
        run: npm ci
      - name: Build
        run: npm run build
      - name: Playwright (funkcjonalne)
        run: npx playwright test --project=desktop --project=mobile
      - name: Playwright (wizualne)
        # --workers=1: running these concurrently lets Chromium's renderer processes contend for
        # CPU, which shows up as font hinting/antialiasing jitter and fails the pixel baselines.
        run: npx playwright test --project=visual-desktop --project=visual-mobile --workers=1
      - name: Raport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy na Hetzner
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/prod'
    # One deploy at a time; a newer push waits rather than cancelling a release mid-switch.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalacja zaleznosci
        run: npm ci
      - name: Build (output standalone)
        run: npm run build
      - name: Paczka release
        # The standalone bundle leaves out public/ and .next/static; server.js serves them from inside it.
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf release.tar.gz -C .next/standalone .
      - name: Konfiguracja SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$SERVER_IP" "$SERVER_USER" > ~/.ssh/config
      - name: Upload i przelaczenie release
        run: |
          scp release.tar.gz "prod:/srv/blueport/releases/$GITHUB_SHA.tar.gz"
          ssh prod bash -s -- "$GITHUB_SHA" < deploy/release.sh
